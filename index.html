<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101014">
  <meta name="description" content="Выберите, где слушать альбом: Яндекс Музыка или Spotify.">
  <title>Слушать альбом</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100svh; margin: 0; display: grid; place-items: center; background: radial-gradient(circle at 50% 22%, #343038 0, #16151a 37%, #0c0c10 80%); color: #fff; }
    main { width: min(100% - 36px, 420px); padding: 42px 26px 28px; border: 1px solid #ffffff21; border-radius: 30px; background: #ffffff0d; box-shadow: 0 24px 80px #0008; text-align: center; }
    .cover { display: block; width: min(58vw, 232px); height: auto; aspect-ratio: 1; object-fit: contain; margin: 0 auto 28px; border-radius: 22px; box-shadow: 0 16px 42px #0007; }
    h1 { margin: 0 0 10px; font-size: clamp(28px, 7vw, 36px); line-height: 1.1; letter-spacing: -.035em; }
    p { margin: 0 0 32px; color: #b9b8be; font-size: 16px; line-height: 1.5; }
    .links { display: grid; gap: 12px; }
    a { display: flex; align-items: center; justify-content: center; gap: 12px; min-height: 62px; padding: 14px 20px; border-radius: 18px; font-size: 17px; font-weight: 700; text-decoration: none; transition: transform .18s, filter .18s; }
    a:hover { transform: translateY(-2px); filter: brightness(1.08); }
    a:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
    .yandex { color: #141414; background: #fed42b; }
    .spotify { color: #0d1711; background: #1ed760; }
    .footer { margin-top: 25px; color: #77767d; font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <img class="cover" src="cover.webp" width="640" height="640" alt="Альтернативная обложка альбома">
    <h1>Слушать альбом</h1>
    <p>Выберите удобный музыкальный сервис</p>
    <nav class="links" aria-label="Музыкальные сервисы">
      <a class="yandex" href="https://music.yandex.ru/album/39395326">Яндекс Музыка ↗</a>
      <a class="spotify" href="https://open.spotify.com/album/5ALxLsRtxTyYX5Rvzygx8W">Spotify ↗</a>
    </nav>
    <div class="footer">Один альбом · два способа слушать</div>
  </main>
</body>
</html>
